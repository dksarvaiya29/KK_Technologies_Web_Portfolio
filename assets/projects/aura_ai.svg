<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080711"/>
      <stop offset="60%" stop-color="#140f2b"/>
      <stop offset="100%" stop-color="#241442"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow4">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad4)" rx="16"/>
  
  <circle cx="650" cy="180" r="150" fill="#7c3aed" opacity="0.25" filter="url(#glow4)"/>
  <circle cx="150" cy="350" r="130" fill="#a855f7" opacity="0.15" filter="url(#glow4)"/>

  <!-- Frame -->
  <g transform="translate(60, 45)">
    <rect width="680" height="410" rx="12" fill="#0d0a1a" stroke="#7c3aed" stroke-width="1.2" opacity="0.95"/>
    <rect width="680" height="38" rx="12" fill="#1b1433"/>
    <circle cx="25" cy="19" r="5" fill="#ef4444"/>
    <circle cx="42" cy="19" r="5" fill="#f59e0b"/>
    <circle cx="59" cy="19" r="5" fill="#10b981"/>
    <rect x="90" y="9" width="380" height="20" rx="6" fill="#2a1f4d"/>
    <text x="110" y="23" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f5f5f7" opacity="0.8">https://agent.aurasupport.ai/workspace</text>

    <!-- Chat Flow Layout Mockup -->
    <g transform="translate(30, 55)">
      <!-- Left: Chat Preview -->
      <rect x="0" y="0" width="360" height="260" rx="10" fill="#151028" stroke="#2c2052"/>
      <!-- Bot Header -->
      <rect x="0" y="0" width="360" height="45" rx="10" fill="#20173e"/>
      <circle cx="25" cy="22" r="12" fill="url(#purpleGrad)"/>
      <text x="45" y="26" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" fill="#ffffff">Aura AI Support Agent</text>
      <circle cx="340" cy="22" r="5" fill="#10b981"/>

      <!-- Message 1: User -->
      <rect x="110" y="60" width="235" height="40" rx="8" fill="#3b2d69"/>
      <text x="125" y="85" font-family="'Poppins', sans-serif" font-size="11" fill="#f5f5f7">Can you send your pricing &amp; portfolio?</text>

      <!-- Message 2: Bot -->
      <rect x="15" y="115" width="270" height="70" rx="8" fill="#261b47" stroke="#7c3aed" stroke-width="1"/>
      <text x="30" y="137" font-family="'Poppins', sans-serif" font-size="11" fill="#ffffff">Sure! Here is the latest rate sheet.</text>
      <text x="30" y="155" font-family="'Poppins', sans-serif" font-size="11" fill="#c4b5fd">Would you like to book a 15-min call?</text>
      <rect x="30" y="163" width="130" height="16" rx="4" fill="#7c3aed"/>
      <text x="40" y="175" font-family="'Poppins', sans-serif" font-size="9" font-weight="700" fill="#ffffff">⚡ Book Strategy Slot</text>

      <!-- Message 3: Auto Qualifier -->
      <rect x="15" y="200" width="300" height="45" rx="8" fill="#1a1236"/>
      <text x="30" y="222" font-family="'JetBrains Mono', monospace" font-size="10" fill="#34d399">✔ Lead auto-qualified into CRM (HubSpot)</text>
      <text x="30" y="236" font-family="'JetBrains Mono', monospace" font-size="9" fill="#9494a3">WhatsApp confirmation sent</text>

      <!-- Right: AI Stats -->
      <g transform="translate(380, 0)">
        <rect x="0" y="0" width="240" height="260" rx="10" fill="#17112c" stroke="#3b2b63"/>
        <text x="20" y="30" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" fill="#c4b5fd" letter-spacing="1">AGENT PERFORMANCE</text>
        
        <text x="20" y="65" font-family="'Montserrat', sans-serif" font-size="28" font-weight="800" fill="#ffffff">99.2%</text>
        <text x="20" y="83" font-family="'Poppins', sans-serif" font-size="11" fill="#a1a1aa">Automated Query Accuracy</text>
        
        <line x1="20" y1="100" x2="220" y2="100" stroke="#2c2052"/>
        
        <text x="20" y="130" font-family="'Montserrat', sans-serif" font-size="28" font-weight="800" fill="#10b981">24/7</text>
        <text x="20" y="148" font-family="'Poppins', sans-serif" font-size="11" fill="#a1a1aa">Zero Downtime Lead Capture</text>
        
        <line x1="20" y1="165" x2="220" y2="165" stroke="#2c2052"/>

        <text x="20" y="195" font-family="'Montserrat', sans-serif" font-size="26" font-weight="800" fill="#f59e0b">3.8x</text>
        <text x="20" y="213" font-family="'Poppins', sans-serif" font-size="11" fill="#a1a1aa">Inquiry Conversion Speed</text>
      </g>

      <!-- Bottom Tags -->
      <g transform="translate(0, 275)">
        <rect x="0" y="0" width="135" height="26" rx="13" fill="#261b47"/>
        <text x="18" y="17" font-family="'Poppins', sans-serif" font-size="11" fill="#f5f5f7">Custom AI Bot</text>
        <rect x="145" y="0" width="145" height="26" rx="13" fill="#261b47"/>
        <text x="160" y="17" font-family="'Poppins', sans-serif" font-size="11" fill="#f5f5f7">WhatsApp Cloud API</text>
        <rect x="300" y="0" width="130" height="26" rx="13" fill="#261b47"/>
        <text x="315" y="17" font-family="'Poppins', sans-serif" font-size="11" fill="#f5f5f7">Gemini / Claude</text>
      </g>
    </g>
  </g>

  <g transform="translate(60, 45)">
    <rect x="390" y="375" width="275" height="26" rx="6" fill="#7c3aed"/>
    <text x="402" y="392" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" fill="#ffffff">★ CLIENT SLOT: READY FOR SCREENSHOT</text>
  </g>
</svg>