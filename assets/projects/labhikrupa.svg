<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0f1923"/>
    </linearGradient>
    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad2)" rx="16"/>

  <!-- Subtle tech lines -->
  <g opacity="0.1" stroke="#7c3aed" stroke-width="1">
    <circle cx="400" cy="250" r="180" fill="none" stroke-dasharray="6,6"/>
    <circle cx="400" cy="250" r="280" fill="none" stroke-dasharray="8,8"/>
    <line x1="100" y1="250" x2="700" y2="250" />
    <line x1="400" y1="50" x2="400" y2="450" />
  </g>

  <!-- Glow effect -->
  <circle cx="200" cy="150" r="130" fill="#7c3aed" opacity="0.22" filter="url(#glow2)"/>
  <circle cx="650" cy="350" r="140" fill="#ff5a1f" opacity="0.15" filter="url(#glow2)"/>

  <!-- Device Frame Mockup -->
  <g transform="translate(60, 45)">
    <rect width="680" height="410" rx="12" fill="#080c14" stroke="#7c3aed" stroke-width="1.2" opacity="0.95"/>
    
    <!-- Top Browser Bar -->
    <rect width="680" height="38" rx="12" fill="#111827"/>
    <circle cx="25" cy="19" r="5" fill="#ef4444"/>
    <circle cx="42" cy="19" r="5" fill="#f59e0b"/>
    <circle cx="59" cy="19" r="5" fill="#10b981"/>
    
    <rect x="90" y="9" width="380" height="20" rx="6" fill="#1f2937"/>
    <text x="110" y="23" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f5f5f7" opacity="0.8">https://labhikrupakitchen.demo</text>
    <rect x="490" y="11" width="75" height="16" rx="4" fill="#7c3aed" opacity="0.3"/>
    <text x="498" y="23" font-family="'Poppins', sans-serif" font-size="10" fill="#c4b5fd" font-weight="600">CONCEPT DEMO</text>

    <!-- Hero Content in Mockup -->
    <g transform="translate(30, 60)">
      <rect x="0" y="0" width="620" height="150" rx="10" fill="#161f30" stroke="#25334d" stroke-width="1"/>
      <text x="25" y="40" font-family="'Montserrat', sans-serif" font-size="22" font-weight="800" fill="#ffffff">LABHIKRUPA FARM KITCHEN</text>
      <text x="25" y="65" font-family="'Poppins', sans-serif" font-size="13" fill="#ff7a1f" font-weight="600">Authentic Kathiyawadi &amp; Desi Dining Experience</text>
      <text x="25" y="90" font-family="'Poppins', sans-serif" font-size="11" fill="#9ca3af">Balancing rooted, homely hospitality with a seamless, mobile-first table booking and digital menu architecture.</text>
      
      <rect x="25" y="105" width="150" height="30" rx="6" fill="url(#glowGrad2)"/>
      <text x="45" y="125" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" fill="#ffffff">Book Dining Slot</text>
      
      <rect x="185" y="105" width="130" height="30" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="205" y="125" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" fill="#ffffff">View Full Menu</text>
    </g>

    <!-- Features / Highlights -->
    <g transform="translate(30, 225)">
      <rect x="0" y="0" width="195" height="100" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1"/>
      <text x="15" y="30" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" fill="#a78bfa">DIGITAL MENU QR</text>
      <text x="15" y="55" font-family="'Montserrat', sans-serif" font-size="18" font-weight="800" fill="#ffffff">&lt; 0.5s Instant</text>
      <text x="15" y="75" font-family="'Poppins', sans-serif" font-size="10" fill="#9ca3af">Zero app download needed</text>

      <rect x="210" y="0" width="195" height="100" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1"/>
      <text x="225" y="30" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" fill="#a78bfa">RESERVATION ENGINE</text>
      <text x="225" y="55" font-family="'Montserrat', sans-serif" font-size="18" font-weight="800" fill="#ffffff">WhatsApp Direct</text>
      <text x="225" y="75" font-family="'Poppins', sans-serif" font-size="10" fill="#9ca3af">Auto-routed notification</text>

      <rect x="420" y="0" width="200" height="100" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1"/>
      <text x="435" y="30" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" fill="#ff7a1f">AUDIENCE IMPACT</text>
      <text x="435" y="55" font-family="'Montserrat', sans-serif" font-size="18" font-weight="800" fill="#10b981">4.9 ★ Rating</text>
      <text x="435" y="75" font-family="'Poppins', sans-serif" font-size="10" fill="#9ca3af">Optimized Google Profile</text>
    </g>

    <!-- Badges -->
    <g transform="translate(30, 345)">
      <rect x="0" y="0" width="140" height="26" rx="13" fill="#1e293b"/>
      <text x="20" y="17" font-family="'Poppins', sans-serif" font-size="11" fill="#f5f5f7">Restaurant UI/UX</text>
      <rect x="150" y="0" width="130" height="26" rx="13" fill="#1e293b"/>
      <text x="165" y="17" font-family="'Poppins', sans-serif" font-size="11" fill="#f5f5f7">Mobile Responsive</text>
      <rect x="290" y="0" width="135" height="26" rx="13" fill="#1e293b"/>
      <text x="305" y="17" font-family="'Poppins', sans-serif" font-size="11" fill="#f5f5f7">Local SEO Funnel</text>
    </g>
  </g>
</svg>