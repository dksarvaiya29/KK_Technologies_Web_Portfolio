<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120e09"/>
      <stop offset="60%" stop-color="#1e140d"/>
      <stop offset="100%" stop-color="#2c1a0e"/>
    </linearGradient>
    <linearGradient id="accentGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a1f"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad1)" rx="16"/>

  <!-- Subtle Grid pattern -->
  <g opacity="0.08" stroke="#ff9800" stroke-width="1">
    <line x1="0" y1="50" x2="800" y2="50" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="250" x2="800" y2="250" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="350" x2="800" y2="350" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="450" x2="800" y2="450" />
    <line x1="100" y1="0" x2="100" y2="500" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="300" y1="0" x2="300" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="500" y1="0" x2="500" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
    <line x1="700" y1="0" x2="700" y2="500" />
  </g>

  <!-- Glow Orbs -->
  <circle cx="680" cy="120" r="140" fill="#ff5a1f" opacity="0.18" filter="url(#glow1)"/>
  <circle cx="150" cy="380" r="120" fill="#e65100" opacity="0.12" filter="url(#glow1)"/>

  <!-- Browser Frame Mockup -->
  <g transform="translate(60, 45)">
    <rect width="680" height="410" rx="12" fill="#0d0906" stroke="#ff5a1f" stroke-width="1.2" opacity="0.95"/>
    
    <!-- Top Browser Bar -->
    <rect width="680" height="38" rx="12" fill="#1b120a"/>
    <circle cx="25" cy="19" r="5" fill="#ef4444"/>
    <circle cx="42" cy="19" r="5" fill="#f59e0b"/>
    <circle cx="59" cy="19" r="5" fill="#10b981"/>
    
    <!-- URL Bar -->
    <rect x="90" y="9" width="380" height="20" rx="6" fill="#291b10"/>
    <text x="110" y="23" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f5f5f7" opacity="0.8">https://vaishaliben.com/shop</text>
    <rect x="490" y="11" width="60" height="16" rx="4" fill="#ff5a1f" opacity="0.3"/>
    <text x="502" y="23" font-family="'Poppins', sans-serif" font-size="10" fill="#ff7a1f" font-weight="600">LIVE DEMO</text>

    <!-- Header UI Inside Browser -->
    <g transform="translate(25, 55)">
      <text x="0" y="22" font-family="'Montserrat', sans-serif" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="0.5">VAISHALIBEN FOODS</text>
      <text x="0" y="42" font-family="'Poppins', sans-serif" font-size="11" fill="#a1a1aa">Authentic Packaged Delicacies &amp; Winter Nourishment</text>
      
      <!-- Cart Icon & Button -->
      <rect x="520" y="5" width="110" height="32" rx="8" fill="url(#accentGrad1)"/>
      <text x="548" y="26" font-family="'Poppins', sans-serif" font-size="12" font-weight="700" fill="#ffffff">Cart (3)</text>
    </g>

    <!-- Product Grid Mockup -->
    <g transform="translate(25, 120)">
      <!-- Product Card 1 -->
      <rect x="0" y="0" width="195" height="190" rx="10" fill="#18110b" stroke="#3d2516" stroke-width="1"/>
      <rect x="15" y="15" width="165" height="90" rx="6" fill="#2d1c10"/>
      <circle cx="97" cy="60" r="30" fill="#ff5a1f" opacity="0.25"/>
      <path d="M85 60 L110 60 M97 48 L97 72" stroke="#ff7a1f" stroke-width="3" stroke-linecap="round"/>
      <text x="15" y="125" font-family="'Poppins', sans-serif" font-size="13" font-weight="600" fill="#ffffff">Premium Methi Pak</text>
      <text x="15" y="145" font-family="'Poppins', sans-serif" font-size="12" font-weight="700" fill="#ff7a1f">₹480 / 500g</text>
      <rect x="15" y="155" width="165" height="24" rx="5" fill="#ff5a1f" opacity="0.9"/>
      <text x="65" y="171" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" fill="#ffffff">Add to Cart</text>

      <!-- Product Card 2 -->
      <rect x="215" y="0" width="195" height="190" rx="10" fill="#18110b" stroke="#3d2516" stroke-width="1"/>
      <rect x="230" y="15" width="165" height="90" rx="6" fill="#2d1c10"/>
      <circle cx="312" cy="60" r="30" fill="#ff5a1f" opacity="0.25"/>
      <text x="230" y="125" font-family="'Poppins', sans-serif" font-size="13" font-weight="600" fill="#ffffff">Organic Adadiya Pak</text>
      <text x="230" y="145" font-family="'Poppins', sans-serif" font-size="12" font-weight="700" fill="#ff7a1f">₹540 / 500g</text>
      <rect x="230" y="155" width="165" height="24" rx="5" fill="#ff5a1f" opacity="0.9"/>
      <text x="280" y="171" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" fill="#ffffff">Add to Cart</text>

      <!-- Metrics Panel 3 -->
      <rect x="430" y="0" width="200" height="190" rx="10" fill="#22160d" stroke="#ff5a1f" stroke-width="1.5"/>
      <text x="445" y="30" font-family="'Poppins', sans-serif" font-size="12" font-weight="700" fill="#ff7a1f" letter-spacing="1">ARCHITECTURAL STATS</text>
      <text x="445" y="65" font-family="'Montserrat', sans-serif" font-size="24" font-weight="800" fill="#ffffff">0.78s</text>
      <text x="445" y="82" font-family="'Poppins', sans-serif" font-size="11" fill="#a1a1aa">Mobile Load Time</text>
      <line x1="445" y1="95" x2="615" y2="95" stroke="#3d2516"/>
      <text x="445" y="125" font-family="'Montserrat', sans-serif" font-size="22" font-weight="800" fill="#10b981">+240%</text>
      <text x="445" y="142" font-family="'Poppins', sans-serif" font-size="11" fill="#a1a1aa">Checkout Conversion Rate</text>
      <rect x="445" y="155" width="170" height="22" rx="4" fill="#10b981" opacity="0.15"/>
      <text x="455" y="170" font-family="'Poppins', sans-serif" font-size="10" font-weight="600" fill="#34d399">WooCommerce + PHP Rebuilt</text>
    </g>

    <!-- Footer tags inside mock -->
    <g transform="translate(25, 330)">
      <rect x="0" y="0" width="125" height="26" rx="13" fill="#2d1c10"/>
      <text x="18" y="17" font-family="'Poppins', sans-serif" font-size="11" fill="#f5f5f7">WooCommerce</text>
      <rect x="135" y="0" width="115" height="26" rx="13" fill="#2d1c10"/>
      <text x="150" y="17" font-family="'Poppins', sans-serif" font-size="11" fill="#f5f5f7">Custom PHP</text>
      <rect x="260" y="0" width="130" height="26" rx="13" fill="#2d1c10"/>
      <text x="275" y="17" font-family="'Poppins', sans-serif" font-size="11" fill="#f5f5f7">Meta Ad Funnels</text>
    </g>
  </g>

  <!-- Watermark / Placeholder Ribbon -->
  <g transform="translate(60, 45)">
    <rect x="420" y="375" width="245" height="26" rx="6" fill="#ff5a1f"/>
    <text x="432" y="392" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" fill="#ffffff">★ KK TECHNOLOGIES CASE STUDY</text>
  </g>
</svg>