        <text x="25" y="40" font-family="'Montserrat', sans-serif" font-size="16" font-weight="700" fill="#ffffff">The Horizon Penthouse</text>
        <text x="25" y="60" font-family="'Poppins', sans-serif" font-size="12" fill="#94a3b8">Interactive 360° Floorplan &amp; VIP Viewing Scheduler</text>
        
        <rect x="25" y="85" width="330" height="40" rx="6" fill="#18243b"/>
        <text x="40" y="110" font-family="'Poppins', sans-serif" font-size="12" fill="#f59e0b" font-weight="600">Private Viewing Concierge: Online</text>

        <rect x="25" y="135" width="140" height="32" rx="6" fill="url(#goldGrad)"/>
        <text x="45" y="156" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" fill="#000000">Schedule Tour</text>

