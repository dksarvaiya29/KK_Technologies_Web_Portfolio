          <text x="20" y="30" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" fill="#fbbf24">LEAD VELOCITY</text>
          <text x="20" y="65" font-family="'Montserrat', sans-serif" font-size="26" font-weight="800" fill="#ffffff">₹35+ Cr</text>
          <text x="20" y="83" font-family="'Poppins', sans-serif" font-size="11" fill="#94a3b8">High-Net-Worth Pipeline</text>
          <line x1="20" y1="98" x2="200" y2="98" stroke="#1e2d45"/>
          <text x="20" y="125" font-family="'Montserrat', sans-serif" font-size="24" font-weight="800" fill="#10b981">68%</text>
          <text x="20" y="145" font-family="'Poppins', sans-serif" font-size="11" fill="#94a3b8">Tour Booking Conversion</text>
        </g>
