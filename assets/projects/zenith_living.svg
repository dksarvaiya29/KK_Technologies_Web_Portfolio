  </defs>

  <rect width="800" height="500" fill="url(#bgGrad5)" rx="16"/>

  <!-- Geometric luxury architectural lines -->
  <g opacity="0.12" stroke="#f59e0b" stroke-width="1.5">
    <polygon points="400,80 580,380 220,380" fill="none"/>
    <polygon points="400,120 540,360 260,360" fill="none"/>
    <polygon points="400,160 500,340 300,340" fill="none"/>
  </g>

  <!-- Frame -->
  <g transform="translate(60, 45)">
